services:
  - type: web
    name: curiowraps-api
    runtime: docker
    dockerContext: .
    dockerfilePath: apps/api/Dockerfile
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 4000
      - key: NODE_ENV
        value: production
      - key: GOOGLE_CLIENT_ID
        value: 281891269995-ji1p45ec0ge87njv6jnq49pp5k5csvq9.apps.googleusercontent.com
      - key: STOREFRONT_URL
        value: https://curiowraps-storefront.vercel.app
      - key: ADMIN_URL
        value: https://curiowraps-admin.vercel.app
      - key: CORS_ORIGINS
        value: https://curiowraps-storefront.vercel.app,https://curiowraps-admin.vercel.app,https://curiowraps.studio,https://www.curiowraps.studio
      - key: AUTH_COOKIE_SAMESITE
        value: none
      - key: AUTH_COOKIE_SECURE
        value: "true"

