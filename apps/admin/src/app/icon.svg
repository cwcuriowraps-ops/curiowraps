<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Smooth Luxury Squircle Background -->
  <rect width="64" height="64" rx="18" fill="#0D0D0E"/>
  
  <!-- Outer Ribbon "C" Curve with Soft Satin Glow -->
  <path d="M 44,17 C 32,10 16,16 13,29 C 10,42 20,53 35,53 C 44,53 50,47 52,43 C 53.5,40 50,38 48.5,41 C 46,46 41,49 34,49 C 23,49 16,40 18,30 C 20,20 31,15 42,19.5 C 44.5,20.5 46.5,18 44,17 Z" 
        fill="url(#ribbonGrad)" />
        
  <!-- Inner Ribbon "W" Form -->
  <path d="M 23,28 L 29,45 L 34,34 L 39,45 L 47,28 C 48,26 45.5,25 44.5,27 L 38.5,40 L 34,30 L 29.5,40 L 25.5,27 C 24.5,25 22,26 23,28 Z" 
        fill="url(#ribbonGrad)" />

  <!-- Delicate Ribbon Bow at the W Apex -->
  <!-- Left Bow Loop -->
  <path d="M 33.5,31 C 29,27 27,33 33.5,33 Z" fill="#F48FB1"/>
  <!-- Right Bow Loop -->
  <path d="M 34.5,31 C 39,27 41,33 34.5,33 Z" fill="#F48FB1"/>
  <!-- Central Bow Knot -->
  <circle cx="34" cy="32" r="2.2" fill="#FFFFFF"/>
  <circle cx="34" cy="32" r="1.5" fill="#EC6F91"/>

  <!-- Linear Gradients for Satin Ribbon Depth -->
  <defs>
    <linearGradient id="ribbonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F48FB1" />
      <stop offset="50%" stop-color="#EC6F91" />
      <stop offset="100%" stop-color="#D81B60" />
    </linearGradient>
  </defs>
</svg>
